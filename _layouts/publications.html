---
layout: compress
---

<!DOCTYPE html>
<html>

<head>
    {% include head.html %}
</head>

<body>
    {% include navbar.html %}

    <!--Main Section-->
    <section class="hero is-fullheight" id="project">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="section">
                    <p class="subtitle is-uppercase has-text-weight-medium has-text-grey">{{ page.title | escape }}</p>
                </div>
                {% assign papers = site.data[page.paper_list] %}
                {% include publication-card.html papers=papers %}
                {% if page.show_preprints_link %}
                <div class="section">
                    <a class="button is-dark" href="{{ '/preprints' | relative_url }}">View more preprints</a>
                </div>
                {% endif %}
            </div>
        </div>
    </section>

    <!--Footer-->
    {% include footer.html %}
</body>

</html>
