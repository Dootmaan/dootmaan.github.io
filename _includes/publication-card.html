<div class="columns is-centered is-multiline is-mobile">
    <div class="container">
        {% for publication in include.papers %}
        <hr>
        <br>
        <div class="columns">
            {% if publication.image %}
            <div class="column is-one-third-desktop is-one-third-tablet is-one-third-fullhd">
                <figure class="image">
                    <img class="image" src="{{ publication.image | relative_url }}" alt="{{ publication.image_alt | default: publication.name | escape }}" loading="lazy">
                </figure>
            </div>
            {% endif %}
            <div
                class="column has-text-left-desktop has-text-left-tablet has-text-left-fullhd has-text-left-widescreen">
                <div class="columns">
                    <p style="font-size: large; font-weight:bold">{{publication.name}}</p>
                </div>
                <div class="columns">
                    <p style="font-size:x-small; font-style: italic; margin-bottom: 10px;">{{publication.authors}}</p>
                </div>
                <div class="columns has-text-grey">
                    <p style="font-size:smaller;">{{publication.description}}</p>
                    <br>
                </div>
                <div class="columns" style="margin-top: 10px;">
                    {% if publication.pdflink %}
                    <a href="{{publication.pdflink}}">
                        <img src="https://img.shields.io/badge/-Paper-ec1c24?style=flat&logo=adobeacrobatreader" alt="Paper">
                    </a>
                    {% endif %}
                    {% if publication.arxivlink %}
                    <a href="{{ publication.arxivlink }}"{% if publication.pdflink %} style="margin-left: 20px;"{% endif %}>
                        <img src="https://img.shields.io/badge/arXiv-b31b1b?style=flat&amp;logo=arxiv" alt="arXiv">
                    </a>
                    {% endif %}
                    {% if publication.codelink %}
                    <a href="{{publication.codelink}}" style="margin-left: 20px;">
                        <img
                            src="https://img.shields.io/github/stars/{{publication.codelink | remove: 'https://github.com/'}}?style=social&label=Star&maxAge=2592000" alt="Code on GitHub">
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>

        {% endfor %}
        <br>
    </div>
</div>
